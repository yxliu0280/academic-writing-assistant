<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewport Probe</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      function sendMessage(type, data) {
        const payload = Object.assign(
          {
            isStreamlitMessage: true,
            type: type,
          },
          data || {}
        );
        window.parent.postMessage(payload, "*");
      }

      function setComponentReady() {
        sendMessage("streamlit:componentReady", { apiVersion: 1 });
      }

      function setFrameHeight(height) {
        sendMessage("streamlit:setFrameHeight", { height: Math.max(0, height || 0) });
      }

      function setComponentValue(value) {
        sendMessage("streamlit:setComponentValue", { value: value });
      }

      function currentViewportHeight() {
        return Math.max(
          0,
          window.innerHeight || 0,
          document.documentElement ? document.documentElement.clientHeight : 0
        );
      }

      function currentAvailableHeight() {
        const viewport = currentViewportHeight();
        const iframe = window.frameElement;
        if (!iframe || !iframe.getBoundingClientRect) {
          return 0;
        }
        const rect = iframe.getBoundingClientRect();
        const reserveBottom = 14;
        return Math.max(0, Math.floor(viewport - rect.top - reserveBottom));
      }

      let lastHeight = 0;
      let lastAvailableHeight = 0;
      let eventId = Date.now();
      function reportHeight() {
        const height = currentViewportHeight();
        const availableHeight = currentAvailableHeight();
        if (!height) return;
        if (height === lastHeight && availableHeight === lastAvailableHeight) return;
        lastHeight = height;
        lastAvailableHeight = availableHeight;
        eventId += 1;
        setComponentValue({
          height: height,
          available_height: availableHeight,
          event_id: eventId,
        });
      }

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        if (resizeTimer) {
          window.clearTimeout(resizeTimer);
        }
        resizeTimer = window.setTimeout(reportHeight, 140);
      });

      window.addEventListener("message", (event) => {
        if (!event.data || !event.data.isStreamlitMessage) return;
        if (event.data.type !== "streamlit:render") return;
        setFrameHeight(0);
        reportHeight();
      });

      setComponentReady();
      setFrameHeight(0);
      window.setTimeout(reportHeight, 0);
    </script>
  </body>
</html>
